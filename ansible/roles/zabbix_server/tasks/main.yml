---
- name: Download Zabbix repository package
  ansible.builtin.get_url:
    url: https://repo.zabbix.com/zabbix/7.0/ubuntu/pool/main/z/zabbix-release/zabbix-release_latest_7.0+ubuntu24.04_all.deb
    dest: /tmp/zabbix-release.deb
    mode: "0644"

- name: Install Zabbix repository
  ansible.builtin.apt:
    deb: /tmp/zabbix-release.deb
    state: present

- name: Update apt cache
  ansible.builtin.apt:
    update_cache: true

- name: Install PostgreSQL
  ansible.builtin.apt:
    name:
      - postgresql
      - postgresql-contrib
      - python3-psycopg2
      - acl
    state: present

- name: Install Zabbix server, frontend and agent2
  ansible.builtin.apt:
    name:
      - zabbix-server-pgsql
      - zabbix-frontend-php
      - php8.3-pgsql
      - zabbix-nginx-conf
      - zabbix-sql-scripts
      - zabbix-agent2
    state: present

- name: Validate Zabbix Vault variables
  ansible.builtin.assert:
    that:
      - vault_zabbix_db_password is defined
      - vault_zabbix_db_password | length >= 8
    fail_msg: "Zabbix DB password is missing or too short"
    success_msg: "Zabbix DB credentials loaded"
  no_log: true

- name: Ensure PostgreSQL is enabled and running
  ansible.builtin.service:
    name: postgresql
    state: started
    enabled: true

- name: Create Zabbix PostgreSQL user
  become_user: postgres
  community.postgresql.postgresql_user:
    name: "{{ zabbix_db_user }}"
    password: "{{ vault_zabbix_db_password }}"
    state: present
  no_log: true

- name: Create Zabbix PostgreSQL database
  become_user: postgres
  community.postgresql.postgresql_db:
    name: "{{ zabbix_db_name }}"
    owner: "{{ zabbix_db_user }}"
    encoding: UTF8
    state: present

- name: Check whether Zabbix schema is already imported
  become_user: postgres
  community.postgresql.postgresql_query:
    db: "{{ zabbix_db_name }}"
    query: "SELECT to_regclass('public.users') AS users_table;"
  register: zabbix_schema_check

- name: Import Zabbix PostgreSQL schema
  become_user: zabbix
  ansible.builtin.shell: |
    set -o pipefail
    zcat /usr/share/zabbix-sql-scripts/postgresql/server.sql.gz \
      | psql -v ON_ERROR_STOP=1 -d {{ zabbix_db_name }}
  args:
    executable: /bin/bash
  when: zabbix_schema_check.query_result[0].users_table is none

- name: Configure Zabbix database host
  ansible.builtin.lineinfile:
    path: /etc/zabbix/zabbix_server.conf
    regexp: '^#?\s*DBHost='
    line: 'DBHost=127.0.0.1'
  notify: Restart Zabbix Server

- name: Configure Zabbix database name
  ansible.builtin.lineinfile:
    path: /etc/zabbix/zabbix_server.conf
    regexp: '^#?\s*DBName='
    line: 'DBName={{ zabbix_db_name }}'
  notify: Restart Zabbix Server

- name: Configure Zabbix database user
  ansible.builtin.lineinfile:
    path: /etc/zabbix/zabbix_server.conf
    regexp: '^#?\s*DBUser='
    line: 'DBUser={{ zabbix_db_user }}'
  notify: Restart Zabbix Server

- name: Configure Zabbix database password
  ansible.builtin.lineinfile:
    path: /etc/zabbix/zabbix_server.conf
    regexp: '^#?\s*DBPassword='
    line: 'DBPassword={{ vault_zabbix_db_password }}'
  no_log: true
  notify: Restart Zabbix Server

- name: Increase Zabbix Server timeout for service checks
  ansible.builtin.lineinfile:
    path: /etc/zabbix/zabbix_server.conf
    regexp: '^\s*#?\s*Timeout='
    line: 'Timeout=10'
  notify: Restart Zabbix Server

- name: Ensure Zabbix Server is enabled and running
  ansible.builtin.service:
    name: zabbix-server
    state: started
    enabled: true

- name: Configure Zabbix Nginx listen address
  ansible.builtin.lineinfile:
    path: /etc/zabbix/nginx.conf
    regexp: '^\s*#?\s*listen\s+'
    line: '        listen 10.10.10.70:80;'
  notify: Restart Nginx

- name: Configure Zabbix Nginx server name
  ansible.builtin.lineinfile:
    path: /etc/zabbix/nginx.conf
    regexp: '^\s*#?\s*server_name\s+'
    line: '        server_name zabbix.ecom.test;'
  notify: Restart Nginx

- name: Ensure Nginx is enabled and running
  ansible.builtin.service:
    name: nginx
    state: started
    enabled: true

- name: Ensure PHP-FPM is enabled and running
  ansible.builtin.service:
    name: php8.3-fpm
    state: started
    enabled: true

- name: Install Zabbix get utility
  ansible.builtin.apt:
    name: zabbix-get
    state: present
