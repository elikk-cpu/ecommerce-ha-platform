---
- name: Create application directory
  ansible.builtin.file:
    path: /opt/ecommerce/app
    state: directory
    owner: aa
    group: aa
    mode: "0755"

- name: Copy application source
  ansible.builtin.copy:
    src: "{{ playbook_dir }}/../../app/"
    dest: /opt/ecommerce/app/
    owner: aa
    group: aa
    mode: preserve
  notify: Rebuild application

- name: Build application image
  community.docker.docker_image:
    name: ecommerce-api
    tag: local
    source: build
    build:
      path: /opt/ecommerce/app
    force_source: false

- name: Run ecommerce API container
  community.docker.docker_container:
    name: ecommerce-api
    image: ecommerce-api:local
    hostname: "{{ inventory_hostname }}"
    state: started
    restart_policy: unless-stopped
    recreate: false
    ports:
      - "{{ app_bind_ip }}:8000:8000"
    env:
      APP_ENV: production

- name: Wait for application health endpoint
  ansible.builtin.uri:
    url: "http://{{ app_bind_ip }}:8000/health"
    method: GET
    status_code: 200
  register: app_health
  retries: 10
  delay: 2
  until: app_health.status == 200
