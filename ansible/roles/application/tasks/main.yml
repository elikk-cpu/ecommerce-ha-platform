---
- name: Create application directory
  ansible.builtin.file:
    path: /opt/ecommerce/app
    state: directory
    owner: aa
    group: aa
    mode: "0755"

- name: Create ecommerce configuration directory
  ansible.builtin.file:
    path: /etc/ecommerce
    state: directory
    owner: root
    group: root
    mode: "0750"

- name: Deploy ecommerce application environment
  ansible.builtin.template:
    src: app.env.j2
    dest: /etc/ecommerce/app.env
    owner: root
    group: root
    mode: "0600"
  no_log: true
  notify: Restart application

- name: Copy application source
  ansible.builtin.copy:
    src: "{{ playbook_dir }}/../../app/"
    dest: /opt/ecommerce/app/
    owner: aa
    group: aa
    mode: preserve
  notify: Rebuild application

- name: Build application image
  community.docker.docker_image:
    name: ecommerce-api
    tag: local
    source: build
    force_source: false
    build:
      path: /opt/ecommerce/app

- name: Run ecommerce API container
  community.docker.docker_container:
    name: ecommerce-api
    image: ecommerce-api:local
    hostname: "{{ inventory_hostname }}"
    state: started
    restart_policy: unless-stopped
    recreate: false

    ports:
      - "{{ app_bind_ip }}:8000:8000"
      - "{{ ansible_host }}:9101:8000"

    env_file: /etc/ecommerce/app.env

    env:
      APP_ENV: production

- name: Wait for application health endpoint
  ansible.builtin.uri:
    url: "http://{{ app_bind_ip }}:8000/health"
    method: GET
    status_code: 200
  register: app_health
  retries: 10
  delay: 2
  until: app_health.status == 200
