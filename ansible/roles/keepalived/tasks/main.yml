---
- name: Install Keepalived
  ansible.builtin.apt:
    name: keepalived
    state: present
    update_cache: true

- name: Deploy HAProxy health check script
  ansible.builtin.template:
    src: check_haproxy.sh.j2
    dest: /usr/local/bin/check_haproxy.sh
    owner: root
    group: root
    mode: "0755"
  notify: Restart Keepalived

- name: Deploy Keepalived configuration
  ansible.builtin.template:
    src: keepalived.conf.j2
    dest: /etc/keepalived/keepalived.conf
    owner: root
    group: root
    mode: "0644"
  notify: Restart Keepalived

- name: Ensure Keepalived is enabled and running
  ansible.builtin.service:
    name: keepalived
    state: started
    enabled: true
