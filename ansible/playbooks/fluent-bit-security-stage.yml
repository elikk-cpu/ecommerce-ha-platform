---
- name: Read Root CA from bastion
  hosts: bastion
  become: true
  gather_facts: false

  tasks:
    - name: Read Ecommerce Root CA
      ansible.builtin.slurp:
        src: /etc/ecommerce-pki/ca/ecommerce-root-ca.crt
      register: ecommerce_root_ca


- name: Stage secure Fluent Bit configuration
  hosts: apps
  become: true
  gather_facts: false

  vars_files:
    - ../vars/opensearch-vault.yml

  tasks:
    - name: Create Fluent Bit certificate directory
      ansible.builtin.file:
        path: /etc/fluent-bit/certs
        state: directory
        owner: root
        group: root
        mode: "0755"

    - name: Deploy Ecommerce Root CA
      ansible.builtin.copy:
        content: "{{ hostvars['bastion']['ecommerce_root_ca']['content'] | b64decode }}"
        dest: /etc/fluent-bit/certs/ecommerce-root-ca.crt
        owner: root
        group: root
        mode: "0644"

    - name: Stage secure Fluent Bit configuration
      ansible.builtin.template:
        src: ../templates/fluent-bit-secure.conf.j2
        dest: /etc/fluent-bit/fluent-bit.conf.stage16
        owner: root
        group: root
        mode: "0644"

    - name: Create Fluent Bit secret environment file
      ansible.builtin.copy:
        dest: /etc/default/fluent-bit-stage16
        owner: root
        group: root
        mode: "0600"
        content: |
          FLUENTBIT_OPENSEARCH_PASSWORD={{ vault_opensearch_fluentbit_password }}
      no_log: true

    - name: Create Fluent Bit systemd override directory
      ansible.builtin.file:
        path: /etc/systemd/system/fluent-bit.service.d
        state: directory
        owner: root
        group: root
        mode: "0755"

    - name: Stage Fluent Bit secret environment override
      ansible.builtin.copy:
        dest: /etc/systemd/system/fluent-bit.service.d/10-stage16-env.conf
        owner: root
        group: root
        mode: "0644"
        content: |
          [Service]
          EnvironmentFile=/etc/default/fluent-bit-stage16

    - name: Reload systemd
      ansible.builtin.systemd:
        daemon_reload: true
