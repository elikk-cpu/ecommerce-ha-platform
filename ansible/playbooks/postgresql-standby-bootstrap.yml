---
- name: Rejoin db2 as PostgreSQL standby
  hosts: db2
  become: true

  vars_files:
    - ../vars/postgresql-vault.yml

  tasks:
    - name: Validate PostgreSQL failover topology
      ansible.builtin.assert:
        that:
          - postgresql_primary_host == "db1"
          - postgresql_primary_ip == "10.40.40.31"
          - postgresql_standby_host == "db2"
          - postgresql_standby_ip == "10.40.40.32"
          - postgresql_force_rebootstrap | default(false) | bool
        fail_msg: "Refusing destructive db2 rebootstrap: verify topology and pass postgresql_force_rebootstrap=true"
        success_msg: "Topology validated: db1 Primary, db2 Standby"

    - name: Stop PostgreSQL on db2
      ansible.builtin.service:
        name: postgresql
        state: stopped

    - name: Remove stale Primary configuration from db2
      ansible.builtin.file:
        path: "/etc/postgresql/{{ postgresql_version }}/main/conf.d/99-ecommerce.conf"
        state: absent

    - name: Remove existing db2 data directory
      ansible.builtin.file:
        path: "/var/lib/postgresql/{{ postgresql_version }}/main"
        state: absent

    - name: Recreate empty data directory
      ansible.builtin.file:
        path: "/var/lib/postgresql/{{ postgresql_version }}/main"
        state: directory
        owner: postgres
        group: postgres
        mode: "0700"

    - name: Deploy PostgreSQL replication password file
      ansible.builtin.copy:
        dest: /var/lib/postgresql/.pgpass
        owner: postgres
        group: postgres
        mode: "0600"
        content: |
          {{ postgresql_primary_ip }}:{{ postgresql_port }}:*:{{ postgresql_replication_user }}:{{ vault_postgresql_replication_password }}
      no_log: true

    - name: Clone new Primary db1 to db2
      become_user: postgres
      ansible.builtin.command:
        cmd: >
          pg_basebackup
          -h {{ postgresql_primary_ip }}
          -p {{ postgresql_port }}
          -U {{ postgresql_replication_user }}
          -D /var/lib/postgresql/{{ postgresql_version }}/main
          -Fp
          -Xs
          -P
          -R
      environment:
        PGPASSFILE: /var/lib/postgresql/.pgpass

    - name: Deploy Standby PostgreSQL configuration
      ansible.builtin.template:
        src: ../roles/postgresql/templates/99-ecommerce-standby.conf.j2
        dest: "/etc/postgresql/{{ postgresql_version }}/main/conf.d/99-ecommerce-standby.conf"
        owner: postgres
        group: postgres
        mode: "0644"

    - name: Start PostgreSQL on db2 as Standby
      ansible.builtin.service:
        name: postgresql
        state: started
        enabled: true
