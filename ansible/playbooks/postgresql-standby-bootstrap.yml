---
- name: Bootstrap PostgreSQL standby
  hosts: db2
  become: true

  vars_files:
    - ../vars/postgresql-vault.yml

  tasks:
    - name: Check whether db2 is already a standby
      ansible.builtin.stat:
        path: "/var/lib/postgresql/{{ postgresql_version }}/main/standby.signal"
      register: standby_signal

    - name: Bootstrap db2 from db1
      when: not standby_signal.stat.exists
      block:

        - name: Stop PostgreSQL on db2
          ansible.builtin.service:
            name: postgresql
            state: stopped

        - name: Remove existing db2 data directory
          ansible.builtin.file:
            path: "/var/lib/postgresql/{{ postgresql_version }}/main"
            state: absent

        - name: Recreate empty data directory
          ansible.builtin.file:
            path: "/var/lib/postgresql/{{ postgresql_version }}/main"
            state: directory
            owner: postgres
            group: postgres
            mode: "0700"

        - name: Deploy PostgreSQL replication password file
          ansible.builtin.copy:
            dest: /var/lib/postgresql/.pgpass
            owner: postgres
            group: postgres
            mode: "0600"
            content: |
              {{ postgresql_primary_ip }}:{{ postgresql_port }}:*:{{ postgresql_replication_user }}:{{ vault_postgresql_replication_password }}
          no_log: true

        - name: Run pg_basebackup from db1
          become_user: postgres
          ansible.builtin.command:
            cmd: >
              pg_basebackup
              -h {{ postgresql_primary_ip }}
              -p {{ postgresql_port }}
              -U {{ postgresql_replication_user }}
              -D /var/lib/postgresql/{{ postgresql_version }}/main
              -Fp
              -Xs
              -P
              -R
          environment:
            PGPASSFILE: /var/lib/postgresql/.pgpass

    - name: Deploy standby PostgreSQL configuration
      ansible.builtin.template:
        src: ../roles/postgresql/templates/99-ecommerce-standby.conf.j2
        dest: "/etc/postgresql/{{ postgresql_version }}/main/conf.d/99-ecommerce-standby.conf"
        owner: postgres
        group: postgres
        mode: "0644"

    - name: Ensure PostgreSQL is started on db2
      ansible.builtin.service:
        name: postgresql
        state: started
        enabled: true
